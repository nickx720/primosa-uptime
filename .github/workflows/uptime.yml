name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: uptime

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          docker run --rm -v "$PWD:/src" -w /src golang:1.26-alpine sh -c 'test -z "$(gofmt -l .)" && go vet ./...'

      - name: Build image
        run: docker build -t primosa-uptime .

      - name: Run uptime check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          docker run --rm -v "$PWD:/data" -w /data \
            -e TELEGRAM_BOT_TOKEN -e TELEGRAM_CHAT_ID \
            primosa-uptime

      - name: Commit state if changed
        run: |
          git diff --quiet || (git config user.name uptime-bot && git config user.email uptime-bot@users.noreply.github.com && git commit -am "state: $(date -u +%FT%TZ)" && git push)
