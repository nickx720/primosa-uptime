name: watchdog

# Secondary/backup layer only. The pinger itself now runs as an always-on
# Railway service (see railway.json, docs/runbooks/deploy-railway.md).
# This workflow just polls its /healthz endpoint every 30 minutes and
# alerts — via a SEPARATE Telegram bot/token — if Railway or the pinger
# process itself goes dark. See docs/002-architecture.md.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: watchdog

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll pinger /healthz and alert on failure or recovery
        env:
          PINGER_HEALTHZ_URL: ${{ vars.PINGER_HEALTHZ_URL }}
          WATCHDOG_BOT_TOKEN: ${{ secrets.WATCHDOG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          STATE_FILE=watchdog-state.json
          PREV_STATUS="ok"
          if [ -f "$STATE_FILE" ]; then
            PREV_STATUS=$(jq -r '.status // "ok"' "$STATE_FILE")
          fi

          if [ -z "${PINGER_HEALTHZ_URL:-}" ]; then
            echo "PINGER_HEALTHZ_URL repo variable not set yet — skipping (set it once Railway gives a domain)."
            exit 0
          fi

          REASON=""
          BODY=""
          if ! BODY=$(curl -fsS --max-time 20 "$PINGER_HEALTHZ_URL"); then
            REASON="unreachable"
          else
            OK=$(echo "$BODY" | jq -r '.ok // false')
            LAST_LOOP_AT=$(echo "$BODY" | jq -r '.last_loop_at // empty')
            if [ "$OK" != "true" ]; then
              REASON="reported unhealthy"
            elif [ -z "$LAST_LOOP_AT" ]; then
              REASON="no last_loop_at in response"
            else
              LAST_EPOCH=$(date -d "$LAST_LOOP_AT" +%s 2>/dev/null || echo 0)
              NOW_EPOCH=$(date -u +%s)
              AGE=$((NOW_EPOCH - LAST_EPOCH))
              if [ "$AGE" -gt 300 ]; then
                REASON="last_loop_at is ${AGE}s old (>5m)"
              fi
            fi
          fi

          NOW_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ -n "$REASON" ]; then
            echo "Watchdog check FAILED: $REASON"
            if [ "$PREV_STATUS" != "failing" ] && [ -n "${WATCHDOG_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -fsS -X POST "https://api.telegram.org/bot${WATCHDOG_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode text="🐶 Watchdog: uptime pinger on Railway is not responding (${REASON}) — Railway itself may be down"
            fi
            NEW_STATUS="failing"
          else
            echo "Watchdog check OK"
            if [ "$PREV_STATUS" = "failing" ] && [ -n "${WATCHDOG_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -fsS -X POST "https://api.telegram.org/bot${WATCHDOG_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode text="🐶 Watchdog: uptime pinger on Railway is responding again"
            fi
            NEW_STATUS="ok"
          fi

          printf '{\n  "status": "%s",\n  "last_checked": "%s"\n}\n' "$NEW_STATUS" "$NOW_ISO" > "$STATE_FILE"

      - name: Commit watchdog state if changed
        run: |
          git add watchdog-state.json && (git diff --cached --quiet || (git config user.name watchdog-bot && git config user.email watchdog-bot@users.noreply.github.com && git commit -m "watchdog: $(date -u +%FT%TZ)" && git push))
